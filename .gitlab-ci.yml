stages:
  - test

unit-tests:
  stage: test
  image: golang:1.27.0
  script:
    - go test -race ./...
    - go vet ./...

secret-scan:
  stage: test
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - gitleaks git --redact --log-opts="--all" .
    - gitleaks dir --redact .
