# Точечные правила по средам, которым системного имени из реестра не хватает.
# Общие шаблоны ci-tools при этом не трогаем.
envs:
  # В шаблонах нет правила: без tags_name задача уйдёт на раннер kt.
  sk-prod:
    tags_name: "<раннер SK>"

  # В реестре значится active, фактически выключена.
  prod-devops:
    skip: "среда выключена"

  # Офисные среды собираются из веток: теги под схему версий не подходят.
  dev:
    skip: "офисная среда, теги веток"
  main:
    skip: "офисная среда, теги веток"
  hf-main:
    skip: "офисная среда, теги веток"
  sprint:
    skip: "офисная среда, теги веток"
  release:
    skip: "офисная среда, теги веток"

  # Среды nit в статусе configuring ещё не развёрнуты: опрашиваем реже.
  nit-adilet:
    interval: "24h"

  # Если системное имя из реестра не совпадает с тем, что понимают шаблоны.
  kegoc-test:
    environment: "kegoc"
