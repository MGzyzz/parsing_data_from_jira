# Точечные правила по средам, которым системного имени из реестра не хватает.
# Общие шаблоны ci-tools при этом не трогаем.
#
# Раннер collect-images выбирает по значению ENVIRONMENT: переменную tags_name
# пайплайн не читает, поэтому переопределить раннер отсюда нельзя. Среде, под
# которую в collect-images нет правила, помогает только правило в самом
# пайплайне — или skip, чтобы не собирать данные из чужого кластера.
envs:
  # Под правила выбора раннера не подходит и уйдёт на раннер по умолчанию.
  sk-prod:
    skip: "нет правила выбора раннера в collect-images"

  # В реестре значится active, фактически выключена.
  prod-devops:
    skip: "среда выключена"

  # Офисные среды собираются из веток: теги под схему версий не подходят.
  dev:
    skip: "офисная среда, теги веток"
  main:
    skip: "офисная среда, теги веток"

  # Опрашивать реже раза в час. Время последнего опроса хранится в STATE_FILE,
  # поэтому интервал работает и при запуске внешним планировщиком.
  nit-adilet:
    interval: "24h"

  # Передать в collect-images другое имя среды вместо имени из реестра.
  # ОСТОРОЖНО: имя задаёт и раннер, и namespace. Подменять его можно только
  # если известно, что целевая среда — та же самая; иначе в строку реестра
  # уедет релиз чужого кластера.
  # some-env:
  #   environment: "other-name"
