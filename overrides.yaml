# Точечные правила по средам. Общие шаблоны ci-tools при этом не трогаем.
# Раннер collect-images выбирает по значению ENVIRONMENT; переменная tags_name
# им не читается, поэтому переопределить раннер отсюда нельзя.
envs:
  # Под правила выбора раннера не подходит и уйдёт на kt, то есть в чужой
  # кластер. Снять запрет, когда в collect-images добавят правило для среды.
  sk-prod:
    skip: "нет правила выбора раннера в collect-images"

  # В реестре значится active, фактически выключена.
  prod-devops:
    skip: "среда выключена"

  # Офисные среды собираются из веток: теги под схему версий не подходят.
  dev:
    skip: "офисная среда, теги веток"
  main:
    skip: "офисная среда, теги веток"
  hf-main:
    skip: "офисная среда, теги веток"
  sprint:
    skip: "офисная среда, теги веток"
  release:
    skip: "офисная среда, теги веток"
