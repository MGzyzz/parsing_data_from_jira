# Запасной вариант: долгоживущий процесс со своим расписанием (-daemon).
# Первый цикл идёт сразу при старте, дальше раз в час. Наложение прогонов
# невозможно по устройству: следующий цикл ждёт завершения предыдущего.
#
# Основной вариант — cronjob.yaml. Этот нужен там, где CronJob неудобен.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: env-release-tracker-state
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: env-release-tracker
spec:
  # Строго одна реплика: две писали бы в одну колонку и удвоили нагрузку
  # на раннеры.
  replicas: 1

  strategy:
    # Не RollingUpdate: иначе при обновлении старый и новый поды какое-то
    # время работают вместе — те же два писателя.
    type: Recreate

  selector:
    matchLabels:
      app: env-release-tracker

  template:
    metadata:
      labels:
        app: env-release-tracker
    spec:
      # Прогон длится минуты, и обрывать его на середине незачем: SIGTERM
      # обрабатывается, но цикл завершится сам.
      terminationGracePeriodSeconds: 60

      securityContext:
        runAsNonRoot: true
        # UID пользователя nonroot в distroless.
        fsGroup: 65532

      containers:
        - name: env-release-tracker
          image: <registry>/env-release-tracker:<tag>

          args: ["-daemon", "-write"]

          envFrom:
            - secretRef:
                name: env-release-tracker

          env:
            - name: GOOGLE_CREDENTIALS_JSON
              value: /app/secrets/service-account.json
            - name: STATE_FILE
              value: /app/state/state.json

          volumeMounts:
            - name: google-key
              mountPath: /app/secrets
              readOnly: true
            - name: state
              mountPath: /app/state

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi

      volumes:
        - name: google-key
          secret:
            secretName: env-release-tracker-google
        - name: state
          persistentVolumeClaim:
            claimName: env-release-tracker-state
